plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

// Only the Release workflow (RELEASE=true) builds the plain mod_version. Every other build is tagged
// as a dev build (with the commit in CI), so a CI artifact can never share a version or file name
// with a published release.
def releaseBuild = providers.environmentVariable('RELEASE').map { it == 'true' }.getOrElse(false)
// BUILD_COMMIT is set by CI to the commit being built (on PRs, the PR's head, not GitHub's merge commit).
def commit = providers.environmentVariable('BUILD_COMMIT').orElse(providers.environmentVariable('GITHUB_SHA')).map { it.take(7) }.getOrNull()
version = releaseBuild ? mod_version : (commit ? "${mod_version}-dev.${commit}" : "${mod_version}-dev")
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    def props = [
            minecraft_version: minecraft_version,
            neo_version      : neo_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : project.version.toString(),
            mod_authors      : mod_authors,
            mod_description  : mod_description,
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
